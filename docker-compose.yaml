version: "3.9"

services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: task_queue
      POSTGRES_USER: samualhalder
      POSTGRES_PASSWORD: samual1234
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host:container
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samualhalder -d task_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ./api
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build: .
    command: ./worker
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    ports:
      - "8081:8081"

volumes:
  db-data:
